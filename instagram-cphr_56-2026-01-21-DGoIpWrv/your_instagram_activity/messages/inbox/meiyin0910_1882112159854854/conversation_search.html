<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>對話搜尋 — 聊癒 TalkHeal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#E07A5F',
          secondary: '#81B29A',
          cream: '#F4F1DE',
          dark: '#3D405B',
        },
        fontFamily: {
          sans: ['"Noto Sans TC"', 'sans-serif'],
          serif: ['"Noto Serif TC"', 'serif'],
        }
      }
    }
  }
</script>
<style>
  body { font-family: 'Noto Sans TC', sans-serif; background-color: #F4F1DE; color: #3D405B; }
  h1, h2, h3, .serif { font-family: 'Noto Serif TC', serif; }
  .smooth-shadow { box-shadow: 0 4px 20px rgba(61, 64, 91, 0.08); }

  /* Mode toggle */
  .mode-btn {
    color: #888;
    background-color: transparent;
    transition: all 0.2s;
  }
  .mode-btn:hover:not(.active) {
    color: #666;
    background-color: rgba(0,0,0,0.03);
  }
  .mode-btn.active {
    background-color: #E07A5F;
    color: white;
    box-shadow: 0 2px 8px rgba(224, 122, 95, 0.3);
  }

  /* Result card expand */
  .result-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }
  .result-card.open .result-content {
    max-height: none;
  }
  .result-card.open .expand-icon {
    transform: rotate(180deg);
  }
  .expand-icon {
    transition: transform 0.25s ease;
  }

  /* Conversation messages */
  .msg { padding: 3px 0; font-size: 0.82rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg-c { color: #3D405B; }
  .msg-m { color: #E07A5F; }
  .msg-time { color: #aaa; }
  .msg-system { color: #aaa; font-style: italic; }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block; width: 18px; height: 18px;
    border: 2px solid #e0ddd0; border-top-color: #E07A5F;
    border-radius: 50%; animation: spin 0.6s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }

  /* Scrollbar */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Highlight */
  mark.hl {
    background: rgba(224, 122, 95, 0.2);
    color: #E07A5F;
    border-radius: 2px;
    padding: 0 2px;
  }
</style>
</head>
<body class="antialiased min-h-screen">

<!-- Header -->
<header class="pt-10 pb-6 px-6 text-center max-w-2xl mx-auto">
  <div class="flex items-center justify-center gap-2 mb-3">
    <span class="text-2xl">🌱</span>
    <h1 class="text-3xl font-bold serif text-primary tracking-wide">對話搜尋</h1>
  </div>
  <p class="text-sm text-gray-500">
    1,711 段對話 · 16 週 · 110,037 則訊息 · 10/13 – 01/26
  </p>
</header>

<!-- Search Area -->
<div class="max-w-2xl mx-auto px-6 pb-6">
  <!-- Search Box -->
  <div class="flex gap-3 mb-4">
    <input
      type="text" id="q" placeholder="搜尋對話內容…" autocomplete="off"
      class="flex-1 bg-white border border-gray-200 rounded-xl px-5 py-3 text-dark text-base outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition smooth-shadow placeholder:text-gray-400"
    >
    <button id="searchBtn" onclick="doSearch()"
      class="bg-primary hover:bg-primary/90 text-white font-medium px-6 py-3 rounded-xl transition shadow-md whitespace-nowrap">
      搜尋
    </button>
  </div>

  <!-- Mode Toggle -->
  <div class="flex justify-center gap-2">
    <button class="mode-btn px-4 py-1.5 rounded-full text-sm font-medium" data-mode="keyword" onclick="setMode(this)">關鍵字</button>
    <button class="mode-btn px-4 py-1.5 rounded-full text-sm font-medium" data-mode="semantic" onclick="setMode(this)">語意</button>
    <button class="mode-btn active px-4 py-1.5 rounded-full text-sm font-medium" data-mode="hybrid" onclick="setMode(this)">混合（推薦）</button>
  </div>
</div>

<!-- Status -->
<div id="status" class="text-center py-3 text-sm text-gray-500"></div>

<!-- Results -->
<div id="results" class="max-w-2xl mx-auto px-6 pb-20 space-y-3"></div>

<script>
const API = 'https://ljqqmtupmyjhkwydtcsj.supabase.co/functions/v1/search-conversations';
const contentCache = {};
let currentMode = 'hybrid';

const qInput = document.getElementById('q');
const searchBtn = document.getElementById('searchBtn');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');

qInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

function setMode(btn) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMode = btn.dataset.mode;
}

async function doSearch() {
  const query = qInput.value.trim();
  if (!query) return;

  searchBtn.disabled = true;
  searchBtn.classList.add('opacity-50');
  statusEl.innerHTML = '<span class="spinner"></span>搜尋中…';
  statusEl.className = 'text-center py-3 text-sm text-gray-500';
  resultsEl.innerHTML = '';

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'search', query, mode: currentMode, limit: 30 }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    const modeLabel = { keyword: '關鍵字', semantic: '語意', hybrid: '混合' }[data.mode] || data.mode;

    if (data.results.length === 0) {
      statusEl.textContent = `沒有找到相關結果（${modeLabel}搜尋）`;
      return;
    }

    // Normalize scores
    const maxScore = Math.max(...data.results.map(r => r.score || 0)) || 1;
    data.results.forEach(r => { r.score = r.score ? r.score / maxScore : 0; });

    statusEl.textContent = `找到 ${data.total} 段對話（${modeLabel}搜尋）`;
    renderResults(data.results, query);
  } catch (err) {
    statusEl.className = 'text-center py-3 text-sm text-red-500';
    statusEl.textContent = '搜尋失敗：' + err.message;
  } finally {
    searchBtn.disabled = false;
    searchBtn.classList.remove('opacity-50');
  }
}

function highlightText(text, query) {
  if (!query) return escHtml(text);
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(${escaped})`, 'gi');
  return escHtml(text).replace(re, '<mark class="hl">$1</mark>');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderResults(results, query) {
  resultsEl.innerHTML = '';
  results.forEach(r => {
    const card = document.createElement('div');
    card.className = 'result-card bg-white rounded-2xl border border-gray-100 smooth-shadow overflow-hidden';
    card.dataset.id = r.id;

    const pct = Math.round(r.score * 100);

    // Badges
    let badges = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-primary/10 text-primary">Week ${r.week_number}</span>`;
    if (r.has_conflict) badges += '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-red-100 text-red-500">🔴 衝突</span>';
    if (r.has_milestone) badges += '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-yellow-100 text-yellow-600">⭐ 里程碑</span>';
    badges += `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-500">${pct}%</span>`;

    card.innerHTML = `
      <div class="p-5 cursor-pointer" onclick="toggleCard(this)">
        <div class="flex items-center gap-2 flex-wrap mb-3">
          ${badges}
          <span class="text-xs text-gray-400 ml-auto">${r.date_range || ''} · ${r.message_count || '?'} 則</span>
        </div>
        <p class="text-sm text-dark leading-relaxed">${highlightText(r.summary || '（無摘要）', query)}</p>
        <div class="flex items-center gap-1.5 mt-3 text-xs text-primary font-medium">
          <svg class="w-4 h-4 expand-icon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          展開對話
        </div>
      </div>
      <div class="result-content"></div>
    `;
    resultsEl.appendChild(card);
  });
}

async function toggleCard(headEl) {
  const card = headEl.parentElement;
  const id = card.dataset.id;
  const contentEl = card.querySelector('.result-content');

  if (card.classList.contains('open')) {
    card.classList.remove('open');
    return;
  }

  card.classList.add('open');

  if (contentCache[id]) {
    contentEl.innerHTML = renderConversation(contentCache[id]);
    return;
  }

  contentEl.innerHTML = '<div class="p-6 text-center text-sm text-gray-400"><span class="spinner"></span>載入對話中…</div>';

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'get_content', id: parseInt(id) }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    contentCache[id] = data.content;
    contentEl.innerHTML = renderConversation(data.content);
  } catch (err) {
    contentEl.innerHTML = `<div class="p-6 text-center text-sm text-red-400">載入失敗：${escHtml(err.message)}</div>`;
  }
}

function renderConversation(content) {
  if (!content) return '<div class="p-6 text-center text-sm text-gray-400">（無內容）</div>';

  const lines = content.split('\n');
  let html = '<div class="px-5 pb-5 pt-3 border-t border-gray-100 bg-cream/40 rounded-b-2xl">';

  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;

    const m = trimmed.match(/^\[(\d{1,2}\/\d{1,2}\s+\d{1,2}:\d{2})\]\s*(C|M):\s*(.*)$/);
    if (m) {
      const [, time, sender, msg] = m;
      const cls = sender === 'C' ? 'msg-c' : 'msg-m';
      const weight = sender === 'C' ? '' : 'font-medium';
      html += `<div class="msg ${cls} ${weight}"><span class="msg-time">[${escHtml(time)}]</span> <b>${sender}</b>: ${escHtml(msg)}</div>`;
    } else {
      html += `<div class="msg msg-system">${escHtml(trimmed)}</div>`;
    }
  }

  html += '</div>';
  return html;
}
</script>
</body>
</html>
